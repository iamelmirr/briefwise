name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  extension:
    name: extension (package vsix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install
        working-directory: extension
        run: npm ci
      - name: Typecheck
        working-directory: extension
        run: npx tsc -p .
      - name: Build
        working-directory: extension
        run: npm run build
      - name: Package
        working-directory: extension
        run: npx @vscode/vsce package --no-dependencies -o briefwise.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: briefwise-vsix
          path: extension/briefwise.vsix
          if-no-files-found: error
